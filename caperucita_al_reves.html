<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caperucita al Revés: ¿Qué final eliges?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --red: #FF4B6E;
    --orange: #FF9F43;
    --yellow: #FFE66D;
    --green: #6BCB77;
    --teal: #4ECDC4;
    --blue: #45B7D1;
    --purple: #C77DFF;
    --dark: #2D3436;
    --cream: #FFF8E7;
    --brown: #8B6914;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #1a472a 0%, #2d6a4f 30%, #1a472a 60%, #0d2818 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .trees {
    position: fixed; bottom: 0; left: 0; width: 100%; z-index: 0;
    pointer-events: none;
  }

  #game-container {
    position: relative; z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #progress-bar-wrap {
    width: 100%;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    height: 12px;
    margin-bottom: 16px;
    overflow: hidden;
    display: none;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #FFE66D, #FF9F43);
    border-radius: 20px;
    transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
    width: 0%;
  }

  #decisions-display {
    display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center;
  }
  .decision-badge {
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
    display: flex; align-items: center; gap: 5px;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .card {
    background: var(--cream);
    border-radius: 32px;
    padding: 28px 28px 24px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.1);
    animation: slideIn 0.5s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
  }
  @keyframes slideIn {
    from { transform: translateY(40px) scale(0.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .illustration {
    width: 100%;
    height: 200px;
    border-radius: 20px;
    margin-bottom: 20px;
    overflow: hidden;
    position: relative;
  }
  .illustration svg { width: 100%; height: 100%; }

  .screen-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(22px, 5vw, 32px);
    color: var(--dark);
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  .screen-title span { color: var(--red); }

  .narration {
    font-size: clamp(15px, 3.5vw, 18px);
    font-weight: 700;
    color: #4a3728;
    line-height: 1.6;
    text-align: center;
    margin-bottom: 22px;
    padding: 0 4px;
  }

  .btn-main {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #FF4B6E, #FF9F43);
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 20px;
    padding: 16px 24px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 6px 0 #c0392b, 0 8px 20px rgba(255,75,110,0.4);
    text-align: center;
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c0392b, 0 12px 28px rgba(255,75,110,0.4); }
  .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #c0392b; }

  .choices { display: flex; flex-direction: column; gap: 14px; }
  .btn-choice {
    background: white;
    border: 4px solid #e0d5c5;
    border-radius: 20px;
    padding: 16px 20px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(14px, 3vw, 17px);
    font-weight: 800;
    color: var(--dark);
    text-align: left;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 4px 0 #c0b090;
  }
  .btn-choice:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 7px 0 #c0b090, 0 10px 20px rgba(0,0,0,0.1); border-color: var(--orange); }
  .btn-choice:active { transform: translateY(2px); box-shadow: 0 2px 0 #c0b090; }
  .choice-icon { font-size: 36px; min-width: 44px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
  .choice-label { font-family: 'Fredoka One', cursive; font-size: 18px; color: var(--red); margin-bottom: 2px; }

  .final-title {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: var(--orange);
    text-align: center;
    margin-bottom: 10px;
  }
  .final-msg {
    background: linear-gradient(135deg, #fff3cd, #ffeaa7);
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 700;
    color: #7d5a00;
    text-align: center;
    margin: 16px 0;
    border-left: 5px solid var(--orange);
  }

  .reflection-q {
    background: white;
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 10px;
    font-size: 16px;
    font-weight: 700;
    color: #4a3728;
    border-left: 5px solid var(--teal);
    display: flex; align-items: center; gap: 10px;
  }

  #voice-controls {
    display: flex; gap: 8px; justify-content: center;
    margin-top: 14px; flex-wrap: wrap;
  }
  .btn-voice {
    background: rgba(255,255,255,0.9);
    border: 3px solid rgba(255,255,255,0.5);
    border-radius: 50px;
    padding: 8px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--dark);
    display: flex; align-items: center; gap: 6px;
  }
  .btn-voice:hover { transform: scale(1.05); background: white; }
  .btn-voice.active { background: var(--teal); color: white; border-color: var(--teal); }

  .confetti-piece {
    position: fixed;
    animation: confettiFall linear forwards;
    z-index: 999;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .divider {
    width: 60px; height: 4px;
    background: linear-gradient(90deg, var(--red), var(--orange));
    border-radius: 2px; margin: 12px auto;
  }

  .btn-secondary {
    background: white;
    border: 3px solid var(--teal);
    color: var(--teal);
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    border-radius: 16px;
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    margin-top: 10px;
    box-shadow: 0 4px 0 #2db5aa;
  }
  .btn-secondary:hover { background: var(--teal); color: white; transform: translateY(-2px); }
</style>

  <div class="card" id="main-card"></div>
  <div id="voice-controls">
    <button class="btn-voice" id="btn-listen" onclick="toggleNarration()">🔊 Escuchar</button>
    <button class="btn-voice" id="btn-pause" onclick="pauseNarration()" style="display:none">⏸ Pausar</button>
    <button class="btn-voice" id="btn-resume" onclick="resumeNarration()" style="display:none">▶️ Reanudar</button>
    <button class="btn-voice" id="btn-mute" onclick="muteNarration()" style="display:none">🔇 Silenciar</button>
  </div>

<script>
const state = { screen: 'start', d1: null, d2: null, d3: null, voiceEnabled: false, voiceMuted: false, utterance: null };

function speak(text) {
  if (!state.voiceEnabled || state.voiceMuted || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-CO'; u.rate = 0.82; u.pitch = 1.1; u.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang.startsWith('es') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('sabina') || v.name.toLowerCase().includes('lucia') || v.name.toLowerCase().includes('paula') || v.name.toLowerCase().includes('carmen'))) || voices.find(v => v.lang.startsWith('es')) || voices[0];
  if (esVoice) u.voice = esVoice;
  state.utterance = u;
  window.speechSynthesis.speak(u);
  document.getElementById('btn-pause').style.display = 'flex';
  document.getElementById('btn-resume').style.display = 'none';
  document.getElementById('btn-mute').style.display = 'flex';
}

function toggleNarration() {
  state.voiceEnabled = !state.voiceEnabled;
  const btn = document.getElementById('btn-listen');
  btn.classList.toggle('active', state.voiceEnabled);
  btn.textContent = state.voiceEnabled ? '🔊 Narrador ON' : '🔊 Escuchar';
  if (state.voiceEnabled) { speak(getCurrentNarrationText()); }
  else { window.speechSynthesis && window.speechSynthesis.cancel(); document.getElementById('btn-pause').style.display='none'; document.getElementById('btn-resume').style.display='none'; document.getElementById('btn-mute').style.display='none'; }
}

function pauseNarration() { window.speechSynthesis && window.speechSynthesis.pause(); document.getElementById('btn-pause').style.display='none'; document.getElementById('btn-resume').style.display='flex'; }
function resumeNarration() { window.speechSynthesis && window.speechSynthesis.resume(); document.getElementById('btn-pause').style.display='flex'; document.getElementById('btn-resume').style.display='none'; }
function muteNarration() {
  state.voiceMuted = true; window.speechSynthesis && window.speechSynthesis.cancel();
  const btn = document.getElementById('btn-mute');
  btn.textContent = '🔈 Activar';
  btn.onclick = () => { state.voiceMuted = false; btn.textContent = '🔇 Silenciar'; btn.onclick = muteNarration; speak(getCurrentNarrationText()); };
}

function getCurrentNarrationText() {
  const texts = {
    start: 'Caperucita al Revés. ¿Qué final eliges? Hoy jugarás con una historia que ya conoces. Pero esta vez, tus decisiones pueden cambiar el final.',
    s2: 'El cazador encontró al lobo muy lleno, muy pesado y muy extraño. El lobo no parecía malo. Parecía confundido y cansado.',
    s3: 'El cazador abrió la panza del lobo y encontró muchas piedras. Sacó una, dos, tres y muchas más. Pero no se dio cuenta de algo muy importante...',
    s4: 'Mientras el cazador sacaba las piedras, Caperucita y su abuelita terminaron dentro del lobo sin que nadie lo notara. Luego, el cazador cerró la panza del lobo. El lobo se fue caminando, sintiéndose muy raro.',
    d1: 'El lobo camina y camina. Se siente raro, lleno y cansado. ¿Qué hace el lobo? Opción A: Entra a una casa, se quita la ropa y se duerme. Opción B: Escucha voces en su barriga y busca ayuda.',
    s6a: 'El lobo entra a una casa. Tiene calor, se quita la ropa y se acuesta a dormir. Ronca muy fuerte y deja la boca muy abierta.',
    s6b: 'El lobo escucha unas voces dentro de él. ¿Quién está ahí? pregunta el lobo. Caperucita y su abuelita responden desde adentro.',
    d2: 'Caperucita empieza a entender lo que pasó. El lobo no quería hacer daño. Todo parecía un malentendido. ¿Qué decide ella pensar? Opción A: Caperucita entiende que el lobo es inocente. Opción B: Caperucita decide hacer quedar mal al lobo.',
    d3: 'Caperucita sabe que el lobo no era malo. Pero también sabe que puede cambiar la historia con sus palabras. ¿Qué decide contar? Opción A: Cuenta la verdad y se disculpa. Opción B: Miente y culpa al lobo.',
    f1: 'Final: El final original del libro. El lobo ronca con la boca muy abierta. Poco a poco, Caperucita y su abuelita logran salir por la boca del lobo. El lobo queda tranquilo y la historia termina como en el libro. A veces, las historias parecen extrañas porque no conocemos todo lo que pasó.',
    f2: 'Final: El final inocente alterno. El lobo escucha voces dentro de su barriga y decide pedir ayuda. No quiero hacer daño, dice el lobo. Solo quiero entender qué pasa. Todos entienden que el lobo era inocente. No hubo maldad, solo una gran confusión. Cuando escuchamos con atención, podemos resolver los problemas sin culpar a nadie.',
    f3: 'Final: Caperucita se redime. Caperucita pensó en hacer quedar mal al lobo. Pero al final se detuvo y dijo la verdad. El lobo no quería hacernos daño. Todo fue un malentendido. Caperucita aprendió que siempre es mejor decir la verdad. A veces podemos equivocarnos, pero también podemos corregir y hacer lo correcto.',
    f4: 'Final: Caperucita villana. Caperucita decidió cambiar la historia. Cuando llegó a casa, dijo que el lobo era malo y que todo había sido culpa de él. Nadie escuchó al lobo. Todos creyeron que era el villano, aunque en realidad era inocente. El lobo se fue triste al bosque. Cuando mentimos para culpar a otra persona, podemos convertirnos en el verdadero problema de la historia.',
    reflection: 'Reflexionemos. ¿Qué cambió en tu historia? ¿El lobo era culpable o inocente? ¿Caperucita dijo la verdad? ¿Qué final te gustó más?'
  };
  return texts[state.screen] || '';
}

    <rect x="370" y="154" width="20" height="28" fill="#7E57C2" rx="3"/>
    <path d="M372,140 Q380,146 388,140" stroke="#795548" stroke-width="1.5" fill="none"/>
    <text x="155" y="125" font-size="32">❤️</text>
    <text x="298" y="118" font-size="28">💙</text>
    <rect x="180" y="20" width="120" height="55" rx="8" fill="white" stroke="#CE93D8" stroke-width="3"/>
    <line x1="240" y1="22" x2="240" y2="73" stroke="#CE93D8" stroke-width="2"/>
    <text x="192" y="52" font-family="Fredoka One" font-size="14" fill="#6A1B9A">Reflexión</text>
    <text x="60" y="55" font-size="28">💡</text><text x="390" y="50" font-size="26">💡</text>
    <text x="130" y="35" font-size="16">✨</text><text x="320" y="28" font-size="18">⭐</text><text x="420" y="70" font-size="14">🌟</text>
  </svg>`
};

const screens = {
  start: { progress: 0,
    render() { return `<div class="illustration">${illustrations.start}</div><div class="screen-title"><span>Caperucita al Revés</span><br>¿Qué final eliges? 📖</div><div class="divider"></div><p class="narration">Hoy jugarás con una historia que ya conoces.<br>Pero esta vez, tus decisiones pueden cambiar el final.</p><button class="btn-main" onclick="go('s2')">¡Empezar! 🌟</button>`; }
  },
  s2: { progress: 15,
    render() { return `<div class="illustration">${illustrations.s2}</div><p class="narration">El cazador encontró al lobo muy lleno, muy pesado y muy extraño.<br>El lobo no parecía malo.<br>Parecía <strong>confundido y cansado</strong>. 🐺</p><button class="btn-main" onclick="go('s3')">Continuar →</button>`; }
  },
  s3: { progress: 25,
    render() { return `<div class="illustration">${illustrations.s3}</div><p class="narration">El cazador abrió la panza del lobo y encontró muchas piedras.<br>Sacó una, dos, tres y muchas más.<br><br>Pero no se dio cuenta de algo <strong>muy importante…</strong> 🪨</p><button class="btn-main" onclick="go('s4')">Continuar →</button>`; }
  },
  s4: { progress: 35,
    render() { return `<div class="illustration">${illustrations.s4}</div><p class="narration">Mientras el cazador sacaba las piedras, <strong>Caperucita y su abuelita</strong> terminaron dentro del lobo sin que nadie lo notara.<br>El lobo se fue caminando, sintiéndose muy raro. 😵</p><button class="btn-main" onclick="go('d1')">Continuar →</button>`; }
  },
  d1: { progress: 45,
    render() { return `<div class="illustration">${illustrations.d1}</div><p class="narration">El lobo camina y camina. Se siente raro, lleno y cansado.<br><strong>¿Qué hace el lobo?</strong></p><div class="choices"><button class="btn-choice" onclick="decide1('A')"><span class="choice-icon">🛏️</span><div><div class="choice-label">Opción A</div>Entra a una casa, se quita la ropa y se duerme.</div></button><button class="btn-choice" onclick="decide1('B')"><span class="choice-icon">👂</span><div><div class="choice-label">Opción B</div>Escucha voces en su barriga y busca ayuda.</div></button></div>`; }
  },
  s6a: { progress: 55,
    render() { return `<div class="illustration">${illustrations.s6a}</div><p class="narration">El lobo entra a una casa. Tiene calor, se quita la ropa y se acuesta a dormir.<br>Ronca muy fuerte y deja la <strong>boca muy abierta</strong>. 😴</p><button class="btn-main" onclick="go('d2')">Continuar →</button>`; }
  },
  s6b: { progress: 55,
    render() { return `<div class="illustration">${illustrations.s6b}</div><p class="narration">El lobo escucha unas voces dentro de él.<br><em>"¿Quién está ahí?"</em> — pregunta el lobo.<br>Caperucita y su abuelita <strong>responden desde adentro</strong>. 👂</p><button class="btn-main" onclick="go('d2')">Continuar →</button>`; }
  },
  d2: { progress: 65,
    render() { return `<div class="illustration">${illustrations.d2}</div><p class="narration">Caperucita empieza a entender lo que pasó. El lobo no quería hacer daño.<br>Todo parecía un <strong>malentendido</strong>.<br>¿Qué decide ella pensar?</p><div class="choices"><button class="btn-choice" onclick="decide2('A')"><span class="choice-icon">🐺💚</span><div><div class="choice-label">Opción A</div>Caperucita entiende que el lobo es inocente.</div></button><button class="btn-choice" onclick="decide2('B')"><span class="choice-icon">😠</span><div><div class="choice-label">Opción B</div>Caperucita decide hacer quedar mal al lobo.</div></button></div>`; }
  },
  d3: { progress: 75,
    render() { return `<div class="illustration">${illustrations.d3}</div><p class="narration">Caperucita sabe que el lobo no era malo.<br>Pero puede <strong>cambiar la historia</strong> con sus palabras.<br>¿Qué decide contar?</p><div class="choices"><button class="btn-choice" onclick="decide3('A')"><span class="choice-icon">💚✅</span><div><div class="choice-label">Opción A</div>Cuenta la verdad y se disculpa.</div></button><button class="btn-choice" onclick="decide3('B')"><span class="choice-icon">🔴❌</span><div><div class="choice-label">Opción B</div>Miente y culpa al lobo.</div></button></div>`; }
  },
  f1: { progress: 95,
    render() { return `<div class="illustration">${illustrations.f1}</div><div class="final-title">⭐ Final del Libro Original ⭐</div><p class="narration">El lobo ronca con la boca muy abierta. Poco a poco, Caperucita y su abuelita logran <strong>salir por la boca del lobo</strong>.<br>El lobo queda tranquilo. La historia termina como en el libro.</p><div class="final-msg">💬 A veces, las historias parecen extrañas porque no conocemos todo lo que pasó.</div><button class="btn-main" onclick="go('reflection')">Ver reflexión 🌟</button>`; }
  },
  f2: { progress: 95,
    render() { return `<div class="illustration">${illustrations.f2}</div><div class="final-title">💚 Final Inocente Alterno 💚</div><p class="narration">El lobo escucha voces y pide ayuda. "No quiero hacer daño", dice. Caperucita y la abuelita salen.<br><strong>¡Todos entienden que el lobo era inocente!</strong></p><div class="final-msg">💬 Cuando escuchamos con atención, podemos resolver los problemas sin culpar a nadie.</div><button class="btn-main" onclick="go('reflection')">Ver reflexión 🌟</button>`; }
  },
  f3: { progress: 95,
    render() { return `<div class="illustration">${illustrations.f3}</div><div class="final-title">💜 Caperucita se Redime 💜</div><p class="narration">Caperucita pensó en hacer quedar mal al lobo. Pero al final <strong>dijo la verdad</strong>. El lobo se sintió aliviado.<br>Caperucita aprendió que es mejor decir la verdad.</p><div class="final-msg">💬 A veces podemos equivocarnos, pero también podemos corregir y hacer lo correcto.</div><button class="btn-main" onclick="go('reflection')">Ver reflexión 🌟</button>`; }
  },
  f4: { progress: 95,
    render() { return `<div class="illustration">${illustrations.f4}</div><div class="final-title">🔴 Caperucita Villana 🔴</div><p class="narration">Caperucita cambió la historia. Dijo que el lobo era malo aunque era inocente.<br>Nadie escuchó al lobo. El lobo se fue <strong>triste al bosque</strong>.</p><div class="final-msg">💬 Cuando mentimos para culpar a otra persona, podemos convertirnos en el verdadero problema de la historia.</div><button class="btn-main" onclick="go('reflection')">Ver reflexión 🌟</button>`; }
  },
  reflection: { progress: 100,
    render() { return `<div class="illustration">${illustrations.reflection}</div><div class="screen-title">🌟 <span>Reflexionemos</span> 🌟</div><div class="divider"></div><div class="reflection-q">💭 ¿Qué cambió en tu historia?</div><div class="reflection-q">🐺 ¿El lobo era culpable o inocente?</div><div class="reflection-q">💚 ¿Caperucita dijo la verdad?</div><div class="reflection-q">⭐ ¿Qué final te gustó más?</div><button class="btn-main" style="margin-top:14px" onclick="restartGame()">🔄 Volver a jugar</button><button class="btn-secondary" onclick="speakReflection()">🔊 Escuchar reflexión</button>`; }
  }
};

function go(screen) {
  state.screen = screen;
  renderScreen();
  if (state.voiceEnabled) setTimeout(() => speak(getCurrentNarrationText()), 300);
}
function decide1(c) { state.d1 = c; updateDecisionsDisplay(); go(c === 'A' ? 's6a' : 's6b'); }
function decide2(c) { state.d2 = c; updateDecisionsDisplay(); if (c === 'A') { go(state.d1 === 'A' ? 'f1' : 'f2'); } else go('d3'); }
function decide3(c) { state.d3 = c; updateDecisionsDisplay(); go(c === 'A' ? 'f3' : 'f4'); }
function restartGame() { state.screen='start'; state.d1=null; state.d2=null; state.d3=null; window.speechSynthesis&&window.speechSynthesis.cancel(); updateDecisionsDisplay(); renderScreen(); }
function speakReflection() { state.voiceEnabled=true; document.getElementById('btn-listen').classList.add('active'); speak(getCurrentNarrationText()); }

function renderScreen() {
  const s = screens[state.screen]; if (!s) return;
  const card = document.getElementById('main-card');
  card.style.animation='none'; card.offsetHeight; card.style.animation='';
  card.innerHTML = s.render();
  const wrap = document.getElementById('progress-bar-wrap');
  const bar = document.getElementById('progress-bar');
  if (state.screen !== 'start') { wrap.style.display='block'; bar.style.width=s.progress+'%'; } else wrap.style.display='none';
  if (['f1','f2','f3'].includes(state.screen)) launchConfetti();
}

function updateDecisionsDisplay() {
  const div = document.getElementById('decisions-display'); div.innerHTML = '';
  if (state.d1) div.innerHTML += `<div class="decision-badge">🐺 D1: ${state.d1==='A'?'😴 Durmió':'👂 Escuchó'}</div>`;
  if (state.d2) div.innerHTML += `<div class="decision-badge">👧 D2: ${state.d2==='A'?'💚 Inocente':'😠 Culpar'}</div>`;
  if (state.d3) div.innerHTML += `<div class="decision-badge">💬 D3: ${state.d3==='A'?'✅ Verdad':'❌ Mentira'}</div>`;
}

function launchConfetti() {
  const colors = ['#FF4B6E','#FF9F43','#FFE66D','#6BCB77','#45B7D1','#C77DFF','#4ECDC4'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div'); p.className = 'confetti-piece';
    const size = 8+Math.random()*10;
    p.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${size}px;height:${size}px;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()}s;border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),4000);
  }
}

function createStars() {
  const c = document.getElementById('stars');
  for (let i=0;i<35;i++) {
    const s=document.createElement('div'); s.className='star';
    const sz=1+Math.random()*3;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*70}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s;`;
    c.appendChild(s);
  }
}

createStars();
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = ()=>{};
renderScreen();
</script>
</body>
</html>
